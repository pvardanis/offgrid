[project]
name = "offgrid"
version = "0.1.0"
description = "Run a coding agent against a local model, tuned to the machine it runs on"
readme = "README.md"
authors = [
    { name = "Panos Vardanis", email = "panos.vardanis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.scripts]
offgrid = "offgrid.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "import-linter>=2.13",
    "interrogate>=1.7",
    "prek>=0.4.12",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "ty>=0.0.1a20",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D", "ANN", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.coverage.run]
source = ["offgrid"]

[tool.coverage.report]
# The badge in the README states the figure; this keeps it from becoming a
# claim nothing checks.
fail_under = 90
show_missing = true

[tool.interrogate]
fail-under = 100
ignore-init-module = true
# `.claude` holds agent worktrees, each a whole checkout of this repo. Walking
# one counts its tests, and the run fails at half the coverage it measured.
exclude = ["tests", ".claude"]

[tool.ty.src]
# The same worktrees, for the same reason: each is a checkout at whatever
# commit its agent was working from, so a name this repo has since changed is
# reported as an unresolved import against code nobody is editing.
exclude = [".claude"]

[tool.importlinter]
root_package = "offgrid"

[[tool.importlinter.contracts]]
name = "The domain knows nothing about adapters"
type = "forbidden"
source_modules = [
    "offgrid.domain",
]
forbidden_modules = [
    "offgrid.agents",
    "offgrid.leaderboards",
    "offgrid.runtimes",
]

[[tool.importlinter.contracts]]
name = "What every layer may reach, reaches nothing of offgrid's"
type = "forbidden"
source_modules = [
    "offgrid.shared",
]
forbidden_modules = [
    "offgrid.cli",
    "offgrid.binding",
    "offgrid.domain",
    "offgrid.agents",
    "offgrid.leaderboards",
    "offgrid.runtimes",
]

[[tool.importlinter.contracts]]
name = "What fits and what runs do not know each other"
type = "independence"
modules = [
    "offgrid.domain.sizing",
    "offgrid.domain.running",
]

[[tool.importlinter.contracts]]
name = "One adapter never reaches for another"
type = "independence"
modules = [
    "offgrid.agents",
    "offgrid.leaderboards",
    "offgrid.runtimes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live checks are opt-in: they need the runtime and the agent on this machine,
# and they let go of whatever the runtime is holding.
addopts = "-q -m 'not live'"
markers = [
    "live: runs against the runtime and agent on this machine, evicting what is held",
]
