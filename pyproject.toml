[project]
name = "offgrid"
version = "0.1.0"
description = "Run a coding agent against a local model, tuned to the machine it runs on"
readme = "README.md"
authors = [
    { name = "Panos Vardanis", email = "panos.vardanis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.scripts]
offgrid = "offgrid.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "interrogate>=1.7",
    "prek>=0.4.12",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "ty>=0.0.1a20",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D", "ANN", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.coverage.run]
source = ["offgrid"]

[tool.coverage.report]
# The badge in the README states the figure; this keeps it from becoming a
# claim nothing checks.
fail_under = 90
show_missing = true

[tool.interrogate]
fail-under = 100
ignore-init-module = true
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live checks are opt-in: they need the runtime and the agent on this machine,
# and they let go of whatever the runtime is holding.
addopts = "-q -m 'not live'"
markers = [
    "live: runs against the runtime and agent on this machine, evicting what is held",
]
